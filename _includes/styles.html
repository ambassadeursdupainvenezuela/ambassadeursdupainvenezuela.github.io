<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/457786595b.js" crossorigin="anonymous"></script>
  <style>
    .bg-primary { background-color: #7f383a; }
    .bg-secondary { background-color: #f69583; }
    .bg-accent { background-color: #fffaf0; }
    .bg-dark { background-color: #7f383a; }
    .bg-dark-opaque { 
      background-color: #7f383a; 
      opacity: 85%;
    }
    .bg-highlight { background-color: #ed7205; }
    .text-primary { color: #7f383a; }
    .text-secondary { color: #f69583; }
    .text-accent { color: #fffaf0; }
    .text-dark { color: #7f383a; }
    .text-highlight { color: #ed7205; }

    .menu-item {
      color: #7f383a;
    }
    .menu-item:hover {
        color: #f69583;
    }
    .carousel-inner {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .carousel-item {
      position: absolute;
      width: 100%;
      transition: opacity 0.5s ease-in-out;
      opacity: 0;
    }
    .carousel-item.active {
      position: relative;
      opacity: 1;
    }
    .carousel-control-prev, .carousel-control-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-control-prev {
      left: 1rem;
    }
    .carousel-control-next {
      right: 1rem;
    }

    p {
      font-weight: 600;
      font-size: 1.5rem; 
      line-height: 2rem;
    }

    /* Tailwind preflight resets headings to inherit; make H2 prominent */
    h2 {
      font-weight: 700;
      font-size: 1.75rem;
      line-height: 2.25rem;
    }

    @media (max-width: 640px) {
      h2 {
        font-size: 1.75rem;
        line-height: 2.25rem;
      }
    }

    /* Masonry gallery in reading order (left->right, top->bottom)
       Uses CSS grid + row spans calculated in JS. */
    .masonry-grid {
      --masonry-gap: 1.5rem;   /* ~24px */
      --masonry-row: 10px;     /* base row height for spanning */
      display: grid;
      /* One column on phones - two narrow columns of photos/cards read
         cramped on small screens. */
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: var(--masonry-gap);
      grid-auto-rows: var(--masonry-row);
      /* Without this, items are stretched to fill their (not yet computed)
         row span, so measuring their real height in JS reads back the
         squashed value instead of their natural content height. */
      align-items: start;
    }
    @media (min-width: 768px) {
      .masonry-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .masonry-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* Wider items (blog cards with title/text, not just a photo) read
       better with fewer, wider columns than the photo gallery. */
    @media (min-width: 1024px) {
      .masonry-grid.masonry-grid-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .masonry-grid-item {
      /* JS will set grid-row-end span */
      break-inside: avoid;
    }
    .masonry-grid-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Skeleton loading state (Galería, Blog y Noticias, /blog.html)
       ---------------------------------------------------------------
       While the real masonry grid is measuring itself (see masonry.html),
       a skeleton with fixed, hardcoded placeholder heights occupies the
       space instead, so nothing ever appears piled up or overlapping.
       Once the real grid is measured and its images are loaded, JS
       crossfades from skeleton to real content.

       Markup shape: a masonry-wrap.is-loading element wrapping a
       masonry-skeleton placeholder, the real masonry-grid, and a
       noscript fallback that force-reveals the grid without JS. See
       index.html and blog.html for the actual markup.

       Note: never spell out a literal closing style tag inside this
       comment (even to describe markup) - the HTML parser looks for
       that raw text to end this whole style block, comment or not,
       and everything after it silently leaks out as visible text. */
    @keyframes skeleton-shimmer {
      0% { background-position: 150% 0; }
      100% { background-position: -50% 0; }
    }
    .skeleton-shimmer {
      background-image: linear-gradient(100deg, #ede1d0 30%, #f8f2e6 45%, #ede1d0 60%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s ease-in-out infinite;
    }

    .masonry-wrap {
      position: relative;
    }
    .masonry-wrap .masonry-grid {
      transition: opacity 0.35s ease;
    }
    .masonry-wrap.is-loading .masonry-grid {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }
    .masonry-skeleton {
      transition: opacity 0.35s ease;
      display: grid;
      /* Must mirror .masonry-grid's breakpoints exactly, or the skeleton
         visibly reflows into a different column count than the real
         grid it's standing in for once it's revealed. */
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .masonry-skeleton { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .masonry-skeleton { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .masonry-skeleton.masonry-skeleton-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .masonry-wrap.is-loaded .masonry-skeleton {
      display: none;
    }

    .skeleton-tile {
      border-radius: 0.5rem;
    }

    .skeleton-card {
      background-color: #fff;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .skeleton-card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .skeleton-line {
      height: 1rem;
      border-radius: 0.25rem;
    }

    /* Blog post hero image: no JS needed, the shimmer is the image's own
       background and shows through until the photo finishes loading and
       paints over it. Full width, natural height (like every other image
       on the site) - no fixed aspect-ratio box, so portrait photos are
       never letterboxed down to a slim strip in the middle. */
    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      background-color: #fffaf0;
    }
    .hero-image.is-loaded {
      animation: none;
      background-image: none;
    }
  </style>
